
name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IncreasingSequence.slnx

      - name: Build solution
        run: >
          dotnet build IncreasingSequence.slnx
          --configuration Release
          --no-restore

      - name: Verify formatting and linting
        run: >
          dotnet format IncreasingSequence.slnx
          --verify-no-changes
          --no-restore
          --verbosity normal

      - name: Run unit tests
        run: >
          dotnet test IncreasingSequence.slnx
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"
